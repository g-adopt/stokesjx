[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "stokesjx"
version = "0.0.1.dev0"
description = "Instantaneous viscous response of a spherically symmetric mantle to internal loads (geoid, dynamic topography, surface velocity), in JAX, with derivatives."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "Siavash Ghelichkhan" },
]
keywords = [
  "geophysics", "geoid", "dynamic topography", "mantle flow",
  "propagator matrix", "adjoint", "JAX",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics",
  "Operating System :: OS Independent",
]
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "jax>=0.4.30", "scipy>=1.11"]

[project.optional-dependencies]
# mpmath runs the high-precision reference solver of tests/reference_mpmath.py,
# and sympy derives the matrix A symbolically in tests/test_equations_symbolic.py.
test = ["pytest>=8", "pytest-timeout>=2.3", "pytest-xdist>=3.5", "mpmath>=1.3", "sympy>=1.12"]
# The analytical Stokes solutions of Kramer, Davies and Wilson (2021, GMD) for
# tests/test_assess.py. The test skips when the package is absent.
reference = ["assess>=1.4"]

[tool.setuptools.packages.find]
include = ["stokesjx*"]

[tool.pytest.ini_options]
# The default run is the quick set: every test without the `slow` marker. It is
# the gate that every chunk runs, and it must stay under 60 s wall time with
# `-n 8` on reunion. The slow set runs only when asked for with `-m slow`, or
# with `-m ""` for both sets. A later `-m` on the command line replaces this one.
# Inside the quick set, the functions listed in tests/heavy_tests.txt carry the
# `heavy` marker (tests/conftest.py adds it). The fast tier is
# `-m "not slow and not heavy"`.
# `--dist loadgroup`: under pytest-xdist (`-n 8`) the tests that carry one
# `xdist_group` mark run on one worker, so that a solve that they share compiles once
# (tests/test_kernels_oracle.py). Without `-n` the option has no effect.
addopts = "-m 'not slow' --dist loadgroup"
# Ceiling on one test. `timeout_func_only` keeps fixture setup outside the
# budget, because the first JAX compile can be slow on its own.
timeout = 1800
timeout_func_only = true
markers = [
  "slow: test that takes more than about 30 s (full-table mpmath recomputations, the Fortran regeneration)",
  "heavy: quick-set test above about 2 s, listed in tests/heavy_tests.txt; the fast tier is -m \"not slow and not heavy\"",
  "legacy: needs legacy/ (the untracked CODE-A copy) and, for a rebuild, the Fortran toolchain",
  "taylor_required: fixed physical Taylor acceptance case",
  "taylor_diagnostic: unresolved numerical experiment",
]
