# Quarto configuration for the stokesjx documentation site.
#
# The site renders from this directory and writes to `docs/_site`, which is not
# tracked. The API reference under `docs/reference/` is generated by quartodoc
# from the docstrings of the package, so a docstring is the only place where an
# API description is written. `make docs` runs `docs/_check_site.py --build`: it
# generates the reference, renders the site and checks both (parser messages,
# render warnings, parameter tables against the signatures, links, display math).

project:
  type: website
  output-dir: _site
  # The generated reference pages are written into `reference/` by
  # `python -m quartodoc build --config _quarto.yml`. That call is not a
  # pre-render hook here, because the hook would need one fixed interpreter name
  # on the PATH. `make docs` runs the two steps in order, and so does the
  # documentation job of the CI workflow.

website:
  title: "stokesjx"
  description: "Instantaneous viscous response of a spherically symmetric mantle to internal loads (geoid, dynamic topography, surface velocity), in JAX, with derivatives."
  site-url: "https://gadopt.org/stokesjx/"
  repo-url: "https://github.com/g-adopt/stokesjx"
  repo-actions: [issue]
  page-navigation: true
  navbar:
    left:
      - text: "Home"
        href: index.qmd
      - text: "Install"
        href: install.qmd
      - text: "Physics"
        href: physics.qmd
      - text: "Usage"
        href: usage.qmd
      - text: "Derivatives"
        href: gradients.qmd
      # The entry links the HTML page, because quartodoc writes the reference
      # pages before the render and the link must not depend on that order.
      - text: "API"
        href: reference/index.html
      - text: "Validation"
        href: validation.qmd
      - text: "Open points"
        href: open-points.qmd
    right:
      - icon: github
        href: "https://github.com/g-adopt/stokesjx"
        aria-label: "The repository on GitHub"
  sidebar:
    style: floating
    contents:
      - index.qmd
      - install.qmd
      - physics.qmd
      - usage.qmd
      - gradients.qmd
      - validation.qmd
      - open-points.qmd
      - agentic-coding.qmd
      - section: "API reference"
        contents:
          # The entry links the HTML page for the reason of the navbar entry
          # "API". The text is the title that quartodoc gives the page.
          - text: "API reference"
            href: reference/index.html
  page-footer:
    center: |
      stokesjx is released under the Apache License, Version 2.0.
      It implements the method of CODE-A (Corrieu, Thoraval and Ricard 1995; Hager and Clayton 1989).

format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: wrap
    number-sections: false
    html-math-method: mathjax

# The API reference: the public names of the package (stokesjx.__all__, the
# classes and functions of the modules fields, sh and controls, and the module
# stokesjx.io.legacy). The low-layer modules propagate, system, boundary and
# linalg are internal and are not in the reference. Every entry is rendered from
# its docstring, and tests/test_docs_site.py checks that the entries are exactly
# the public names.
quartodoc:
  title: "API reference"
  package: stokesjx
  dir: reference
  style: pkgdown
  parser: numpy
  render_interlinks: false
  sections:
    - title: "About this reference"
      desc: >
        This reference lists the public names of the package. The low-layer modules
        (propagate, system, boundary and linalg) are internal and are not listed.
        Equation and section numbers in the docstrings refer to the sections of the
        physics page. The docstrings also cite the author's working notes and rulings
        by name, as a record of the sources of a number or a decision. These notes are
        not published.
      contents: []
    - title: "Kernels"
      desc: >
        The forward map. StokesConfig holds the static choices (the maximum
        degree, the physics flags, the units and the numerical options), and
        stokes_kernels is a pure function of a RadialProfile and a
        StokesConfig. It returns the four kernels per degree and node in SI
        units. The function is valid under jax.jit, jax.grad, jax.jvp and
        jax.vmap.
      contents:
        - kernels.StokesConfig
        - kernels.Numerics
        - kernels.stokes_kernels
        - kernels.Kernels
    - title: "Physics flags"
      desc: >
        The static flags of the problem: the gravity level, the background
        gravity, the compressibility (TALA) and the boundary class at the
        surface and at the CMB. Every combination is solved.
        DegreeOneFrame is the frame request of degree 1.
      contents:
        - formulation.Formulation
        - formulation.GravityModel
        - formulation.Hydrostatic
        - formulation.Uniform
        - formulation.BoundaryCondition
        - formulation.FreeSlip
        - formulation.NoSlip
        - formulation.DegreeOneFrame
    - title: "Radial profile"
      desc: >
        The radial model: the node table (CMB first, a jump is a node pair),
        the reference density, the viscosity and the core. RadialProfile is a
        pytree, so a derivative can move its arrays. NodeStructure is its
        static part. integrate_gravity is the hydrostatic gravity of
        equation 6.1.
      contents:
        - profile.RadialProfile
        - profile.NodeStructure
        - profile.NodeLimits
        - profile.integrate_gravity
        - units.Units
    - title: "Fields"
      desc: >
        Post-processing of the kernels: the radial integral of a kernel times a
        density anomaly with the trapezoid weights of the node table, the
        gravity anomaly, the admittance and a weighted degree-power misfit.
        A field has the layout and the convention of its density.
      contents:
        - fields.Fields
        - fields.apply
        - fields.radial_integral
        - fields.quadrature_weights
        - fields.spectral_misfit
        - fields.surface_gravity
        - fields.gravity_anomaly
        - fields.admittance
    - title: "Controls"
      desc: >
        The maps from the controls of an inversion to a RadialProfile. Layers
        takes one log viscosity per layer and the radii of the movable
        viscosity boundaries. viscosity_by_node takes one log viscosity per
        node. ControlVector turns a pytree of controls into one vector with a
        jitted value and gradient.
      contents:
        - controls.Layers
        - controls.MovableRange
        - controls.viscosity_by_node
        - controls.NodeViscosity
        - controls.ControlVector
    - title: "Spherical harmonics"
      desc: >
        Three coefficient conventions (complex_4pi, real_4pi and
        real_orthonormal) with one layout rule for every coefficient array,
        their conversions, a grid synthesis, the degree power and the
        Gauss-Legendre transform. The conventions follow lovejx.
      contents:
        - sh.gauss_legendre
        - sh.legendre_table
        - sh.GaussLegendreGrid
        - sh.analysis
        - sh.synthesis
        - sh.check_layout
        - sh.convert
        - sh.synthesis_grid
        - sh.degree_power
    - title: "CODE-A file formats"
      desc: >
        The readers and the writer of the file formats of CODE-A: the density
        file (.sph), the viscosity file and the SPHCO coefficient files. The
        module stokesjx.io.legacy needs numpy only, and the package does not
        import it. Import it on use.
      contents:
        - io.legacy.SphDensity
        - io.legacy.read_viscosity
        - io.legacy.read_sph
        - io.legacy.read_sphco
        - io.legacy.write_sphco
